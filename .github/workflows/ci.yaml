name: CI

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/big10survivor

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  preview:
    name: Release preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest-tag
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=${LATEST}" >> "$GITHUB_OUTPUT"

      # Commits already merged to the base branch but never actually released
      # (e.g. a prior Release run failed) still count toward the next version,
      # since semantic-release itself walks everything since the last tag —
      # not just this PR's commits. `HEAD` here is the PR's merge-ref checkout
      # (base + PR head merged), so this covers both.
      - name: Collect unreleased commit messages
        id: unreleased
        run: |
          git log "${{ steps.latest-tag.outputs.tag }}..HEAD" --no-merges --format='%B%x00' > /tmp/unreleased-commits.txt

      - name: Compute and post release preview
        uses: actions/github-script@v7
        with:
          script: |
            const latestTag = '${{ steps.latest-tag.outputs.tag }}';

            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/unreleased-commits.txt', 'utf8');
            const messages = raw.split('\0').map(s => s.trim()).filter(Boolean);

            let bump = null;
            for (const msg of messages) {
              if (/BREAKING CHANGE/.test(msg) || /^[a-z]+(\(.+\))?!:/.test(msg)) {
                bump = 'major';
                break;
              }
              if (/^feat(\(.+\))?:/.test(msg) && bump !== 'major') bump = 'minor';
              if (/^(fix|perf|revert)(\(.+\))?:/.test(msg) && !bump) bump = 'patch';
            }

            const marker = '<!-- semantic-release-preview -->';
            let body;

            if (!bump) {
              body = `${marker}\n📦 No new release will be created (no releasable commits).`;
            } else {
              const [major, minor, patch] = latestTag.replace('v', '').split('.').map(Number);
              const next = bump === 'major' ? `${major + 1}.0.0`
                         : bump === 'minor' ? `${major}.${minor + 1}.0`
                         : `${major}.${minor}.${patch + 1}`;
              body = `${marker}\n🚀 Merging this PR will release **v${next}**`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }